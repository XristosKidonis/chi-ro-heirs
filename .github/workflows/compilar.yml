name: Compilar instaladores

# Se ejecuta a mano (pestaña Actions → «Compilar instaladores» → Run workflow)
# o al subir una etiqueta de versión como v0.1.0. Publica los instaladores en Releases.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: macos-latest
            args: --target universal-apple-darwin
          - plataforma: windows-latest
            args: ''
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Caché de las fuentes bíblicas
        uses: actions/cache@v4
        with:
          path: datos/fuentes
          key: fuentes-${{ hashFiles('herramientas/construir_datos.py') }}

      - name: Construir la base bíblica
        run: python herramientas/construir_datos.py

      - name: Dependencias
        run: npm ci

      - name: Compilar y publicar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Chi-Ro Heirs v__VERSION__
          releaseBody: |
            Descarga el instalador de tu sistema en «Assets»:
            - **Mac**: el archivo `.dmg` (funciona en Mac con Apple Silicon e Intel).
            - **Windows**: el archivo `-setup.exe`.
            La primera vez, tu sistema avisará de que la app no está firmada; las instrucciones están en el LEEME.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
